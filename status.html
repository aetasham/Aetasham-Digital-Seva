<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status | Aetasham Digital Seva</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">🖥️ Aetasham Digital Seva</div><nav><a href="index.html">Home</a><a href="services.html">Services</a><a class="active" href="status.html">Status</a><a href="login.html">Login</a></nav></header><main><section class="formbox"><span class="tag">TRACK REQUEST</span><h1>Application Status</h1><p class="muted">Enter the request ID you received after submitting a service request.</p><form onsubmit="check(event)"><label>Request ID<input id="rid" placeholder="Example: ADS12345678" required></label><button>Check Status</button></form><div id="out" class="result"></div></section></main><footer>Private digital assistance centre • Not an official government website</footer><script>function check(e){e.preventDefault();const d=JSON.parse(localStorage.getItem('ads_'+rid.value.trim()));out.innerHTML=d?'<strong>'+d.service+'</strong><br>Applicant: '+d.name+'<br>Status: <b>'+d.status+'</b><br>Request ID: '+d.id:'No request found in this browser. Please check the ID.'}</script></body></html>
