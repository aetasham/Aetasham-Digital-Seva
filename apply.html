<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | Aetasham Digital Seva</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">🖥️ Aetasham Digital Seva</div><nav><a href="index.html">Home</a><a href="services.html">Services</a><a href="status.html">Status</a><a href="login.html">Login</a></nav></header><main><section class="formbox"><span class="tag">APPLICATION REQUEST</span><h1>Apply for a Service</h1><p class="muted">This form records a service request for private digital assistance.</p><form onsubmit="submitRequest(event)"><label>Service<select id="service" required><option value="">Select service</option><option>PAN</option><option>Voter</option><option>Ration Card</option><option>Certificate</option><option>Government Scheme</option><option>Online Form</option><option>Print & Documents</option><option>Other</option></select></label><label>Applicant name<input id="name" required maxlength="80"></label><label>Mobile number<input id="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label><label>Request details<textarea id="details" rows="5" maxlength="500" placeholder="Tell us what service you need"></textarea></label><button type="submit">Submit Request</button></form><div id="result" class="result"></div></section></main><footer>Private digital assistance centre • Not an official government website</footer><script>const p=new URLSearchParams(location.search).get('service');if(p)document.getElementById('service').value=p;function submitRequest(e){e.preventDefault();const id='ADS'+Date.now().toString().slice(-8);localStorage.setItem('ads_'+id,JSON.stringify({id,service:service.value,name:name.value,status:'Submitted'}));result.innerHTML='<strong>Request submitted!</strong><br>Your request ID is <b>'+id+'</b>. Save it to check status.';e.target.reset();if(p)service.value=p;}</script></body></html>
